# Notes
# - Consider trying: https://github.com/schasse/tmux-jump

# Terminal and shell
set -g default-command "${SHELL}"
set -g default-terminal "tmux-256color"
# Tell tmux which terminals support true color and OSC 8 hyperlinks.
set -as terminal-features ",tmux-256color:RGB,hyperlinks"
set -as terminal-features ",kitty:RGB,hyperlinks"
set -g allow-passthrough on
set-option -g xterm-keys on

# Core behavior
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g mouse on
setw -g monitor-activity on

# Prefix and keybindings
unbind C-b
set -g prefix M-e
bind Space send-prefix

# Split panes in the current working directory.
bind-key v split-window -h -c '#{pane_current_path}'
bind-key s split-window -v -c '#{pane_current_path}'

# Move between windows quickly.
bind-key -r h previous-window
bind-key -r l next-window

# Resize panes in fixed steps.
bind-key H resize-pane -L 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key L resize-pane -R 5

# Utility and destructive actions.
bind-key i run-shell 'popuptmux'
bind-key q kill-window
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
bind-key t choose-window
bind-key w kill-pane

# Copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Window and pane numbering
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position bottom
set -g pane-border-lines heavy
set -g pane-border-indicators arrows

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jaclu/tmux-power-zoom'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-sessionx'

# Catppuccin theme
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style rounded
set -g @catppuccin_menu_selected_style "fg=#{@thm_surface_0},bg=#{@thm_yellow}"

# Catppuccin pane styling
set -g @catppuccin_pane_status_enabled yes
set -g @catppuccin_pane_border_status on
set -g @catppuccin_pane_border_style "fg=#{@thm_peach}"
set -g @catppuccin_pane_color "#{@thm_yellow}"
set -g @catppuccin_pane_left_separator ""
set -g @catppuccin_pane_middle_separator ""
set -g @catppuccin_pane_right_separator ""
# Highlight panes differently in copy mode and synchronized mode.
set -g @catppuccin_pane_active_border_style "##{?pane_in_mode,fg=#{@thm_peach},##{?pane_synchronized,fg=#{@thm_yellow},fg=#{@thm_peach}}}"
set -g @catppuccin_pane_background_color "#{@thm_surface_0}"
set -g @catppuccin_pane_default_text "##{b:pane_current_path}"
set -g @catppuccin_pane_default_fill number
set -g @catppuccin_pane_number_position left

# Catppuccin window styling
# Keep inactive windows mostly grey with a small warm accent.
set -g @catppuccin_window_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_number_color "#{@thm_peach}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number " "
# The active window uses a custom format override below.
set -g @catppuccin_window_current_text_color "#{@thm_peach}"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_number_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number "  "
set -g @catppuccin_window_number_position left
set -g @catppuccin_window_flags none
set -g @catppuccin_window_flags_icon_last " 󰖰"
set -g @catppuccin_window_flags_icon_current " 󰖯"
set -g @catppuccin_window_flags_icon_zoom " 󰁌"
set -g @catppuccin_window_flags_icon_mark " 󰃀"
set -g @catppuccin_window_flags_icon_silent " 󰂛"
set -g @catppuccin_window_flags_icon_activity " 󱅫"
set -g @catppuccin_window_flags_icon_bell " 󰂞"
# Match tmux flag order when rendering window state icons.
set -g @catppuccin_window_flags_icon_format "##{?window_activity_flag,#{E:@catppuccin_window_flags_icon_activity},}##{?window_bell_flag,#{E:@catppuccin_window_flags_icon_bell},}##{?window_silence_flag,#{E:@catppuccin_window_flags_icon_silent},}##{?window_active,#{E:@catppuccin_window_flags_icon_current},}##{?window_last_flag,#{E:@catppuccin_window_flags_icon_last},}##{?window_marked_flag,#{E:@catppuccin_window_flags_icon_mark},}##{?window_zoomed_flag,#{E:@catppuccin_window_flags_icon_zoom},} "

# Status line
set -g @catppuccin_status_background "#1d2021"
set -g @catppuccin_status_connect_separator yes
set -g @catppuccin_status_module_bg_color "#{@thm_surface_1}"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""

# Shared right-side palette.
set -g @right_status_icon_fg "#32302f"
set -g @right_status_fg "#fbf1c7"

# Right-side modules: git -> folder -> app -> session -> host -> uptime.
set -g @catppuccin_status_directory_icon_bg "#fadb7b"
set -gF @catppuccin_status_directory_icon_fg "#{@right_status_icon_fg}"
set -gF @catppuccin_status_directory_text_fg "#{@right_status_fg}"

set -g @catppuccin_gitmux_icon " "
set -g @catppuccin_status_gitmux_icon_bg "#fbf1c7"
set -gF @catppuccin_status_gitmux_icon_fg "#{@right_status_icon_fg}"
set -gF @catppuccin_status_gitmux_text_fg "#{@right_status_fg}"

set -g @catppuccin_status_host_icon_bg "#fc6527"
set -gF @catppuccin_status_host_icon_fg "#{@right_status_icon_fg}"
set -gF @catppuccin_status_host_text_fg "#{@right_status_fg}"

set -g @catppuccin_application_icon " "
set -g @catppuccin_status_application_icon_bg "#fabd2f"
set -gF @catppuccin_status_application_icon_fg "#{@right_status_icon_fg}"
set -gF @catppuccin_status_application_text_fg "#{@right_status_fg}"

set -g @catppuccin_status_session_icon_bg "#fe8019"
set -gF @catppuccin_status_session_icon_fg "#{@right_status_icon_fg}"
set -gF @catppuccin_status_session_text_fg "#{@right_status_fg}"

set -g @catppuccin_uptime_icon "󰔛 "
set -g @catppuccin_status_uptime_icon_bg "#fb4934"
set -gF @catppuccin_status_uptime_icon_fg "#{@right_status_icon_fg}"
set -gF @catppuccin_status_uptime_text_fg "#{@right_status_fg}"

# Build status-right incrementally so each module stays visible.
set -g status-right "#{E:@catppuccin_status_gitmux}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# TPM bootstrap
run '~/.tmux/plugins/tpm/tpm'

# Override window formats after TPM loads plugins so Catppuccin does not
# overwrite the custom left/right foreground and background pairing.
set -gF window-status-format "#[fg=#{@thm_surface_1},bg=#{@_ctp_status_bg}]#[fg=#{@thm_peach},bg=#{@thm_surface_1}]#{@catppuccin_window_number}#{E:@catppuccin_window_middle_separator}#[fg=#{@thm_peach},bg=#{@thm_surface_1}]#{@catppuccin_window_text}#{@_ctp_w_flags}#[fg=#{@thm_surface_1},bg=#{@_ctp_status_bg}]"
set -gF window-status-current-format "#[fg=#{@thm_surface_1},bg=#{@_ctp_status_bg}]#[bold,fg=#{@thm_red},bg=#{@thm_surface_1}]#{@catppuccin_window_current_number}#{E:@catppuccin_window_current_middle_separator}#[bold,fg=#{@thm_crust},bg=#{@thm_peach}]#{@catppuccin_window_current_text}#{@_ctp_w_flags}#[fg=#{@thm_peach},bg=#{@_ctp_status_bg}]"

# Fake a gap above the bottom status bar with a blank extra status row.
set -g status 2
set -g status-format[0] "#[bg=default,fg=default] "
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
